name: Offline integration support
on:
  push:
    branches: [support/offline-integration-hmem]
    paths: ['integration_support/**', '.github/workflows/integration-support.yml']
  pull_request:
    branches: [integration]
    paths: ['integration_support/**', '.github/workflows/integration-support.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check conflict safety and reproduce pinned disposable merges
        run: |
          git config user.name 'Quorum offline rehearsal'
          git config user.email 'ci@users.noreply.github.com'
          python -m unittest discover -s integration_support -p 'test_*.py'
          python integration_support/rehearse.py --repo "$GITHUB_WORKSPACE" --destination "$RUNNER_TEMP/quorum-rehearsal" --with-proposed-patches
          python integration_support/check_tree.py --root "$RUNNER_TEMP/quorum-rehearsal"
          git -C "$RUNNER_TEMP/quorum-rehearsal" diff --check f59e75840c9aee67ca35a8f44bf5dd42747af75f HEAD
      - name: Install test dependencies outside the repository
        run: |
          python -m pip install -r "$RUNNER_TEMP/quorum-rehearsal/backend/requirements.txt"
          python -m pip install -e "$RUNNER_TEMP/quorum-rehearsal/reasoning[dev]"
      - name: Test combined Python components with sockets blocked
        env:
          QUORUM_DRY_RUN: '1'
          DJANGO_DEBUG: '1'
          QUORUM_PORTAL_DATA: ${{ runner.temp }}/quorum-test-auth
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/integration_support/offline:$RUNNER_TEMP/quorum-rehearsal/reasoning"
          cd "$RUNNER_TEMP/quorum-rehearsal"
          python -m pytest reasoning/tests -q
          python -c "from collectors import verify_collectors as v; v.check_csv(); assert 'FAIL' not in v.seen"
          python backend/manage.py test portal
          python -m unittest discover -s deploy -p 'test_*.py'
          python -m unittest discover -s scripts -p 'test_*.py'
          python backend/manage.py check
          python backend/manage.py makemigrations --check --dry-run
          python backend/manage.py portal_snapshot validate --file backend/portal/fixtures/analysis-demo.json
          python scripts/checks.py verify --offline || test "$?" -eq 2

      # DECISION(2026-10-24, rcc00n/Codex): test proposed web patches on the reconstructed owner tree.
      # Why: support-only path filters otherwise leave browser and compiled-output changes untested.
      - name: Build combined web and verify compiled receipt
        env:
          QUORUM_WEB_BUILD: ${{ runner.temp }}/quorum-web-build
        run: |
          cd "$RUNNER_TEMP/quorum-rehearsal"
          bash deploy/build-web.sh
          python -c "from deploy.build_integrity import validate_build; import os; validate_build('.',os.environ['QUORUM_WEB_BUILD'])"
          node web/tests/ratings.cjs
          node web/tests/editorial.cjs
          node web/tests/reasoning-trace.cjs
          QUORUM_PYTHON=python node web/tests/contract.cjs
      - name: Install isolated browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/quorum-browser" --no-audit --no-fund --ignore-scripts playwright@1.64.1
          node "$RUNNER_TEMP/quorum-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Exercise authenticated combined product and keyboard journey
        env:
          QUORUM_WEB_BUILD: ${{ runner.temp }}/quorum-web-build
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/quorum-browser/node_modules/playwright
          QUORUM_SCREENSHOTS: ${{ runner.temp }}/quorum-screenshots
          QUORUM_PYTHON: python
        run: |
          cd "$RUNNER_TEMP/quorum-rehearsal"
          node web/tests/boundary.cjs
          node web/tests/boundary.cjs --reasoning
          node web/tests/boundary.cjs --reasoning --roundup-checks
