name: Portal regressions
on:
  push:
    branches: [feature/web-portals]
    paths: ['backend/**', 'web/**', 'deploy/**', '.github/workflows/portal.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portal:
    if: github.ref == 'refs/heads/feature/web-portals'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DJANGO_DEBUG: '1'
      QUORUM_PORTAL_DATA: /tmp/quorum-ci-auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r backend/requirements.txt
      - run: python backend/manage.py check && python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py test portal && python -m unittest discover -s deploy -p 'test_*.py'
      - run: python backend/manage.py portal_snapshot validate --file backend/portal/fixtures/analysis-demo.json
      - run: bash deploy/build-web.sh && node web/tests/ratings.cjs && node web/tests/editorial.cjs
      - run: QUORUM_PYTHON=python node web/tests/contract.cjs
