name: Portal regressions
# DECISION(2026-10-24, rcc00n/Codex): cover integration and its PRs as well as web.
# Why: the approved sequential merge workflow needs web regressions after owner changes.
on:
  push:
    branches: ["feature/web-*", integration]
    paths: ['backend/**', 'web/**', 'deploy/**', 'reasoning/**', 'collectors/**', 'agent/**', 'scripts/**', 'docs/examples/**', '.github/workflows/portal.yml']
  pull_request:
    branches: [integration, master]
    paths: ['backend/**', 'web/**', 'deploy/**', 'reasoning/**', 'collectors/**', 'agent/**', 'scripts/**', 'docs/examples/**', '.github/workflows/portal.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portal:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/feature/web-') || github.ref == 'refs/heads/integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      DJANGO_DEBUG: '1'
      QUORUM_PORTAL_DATA: /tmp/quorum-ci-auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r backend/requirements.txt
      - run: python backend/manage.py check && python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py test portal && python -m unittest discover -s deploy -p 'test_*.py'
      - run: python backend/manage.py portal_snapshot validate --file backend/portal/fixtures/analysis-demo.json
      - run: bash deploy/build-web.sh && node web/tests/ratings.cjs && node web/tests/editorial.cjs && node web/tests/reasoning-trace.cjs
      - run: QUORUM_PYTHON=python node web/tests/contract.cjs
      # DECISION(2026-10-24, rcc00n/Codex): browser checks use disposable fictional inputs and external tooling.
      # Why: integration CI must exercise auth, partial output and skipped-check UI without private corpora or provider calls.
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/quorum-browser" --no-audit --no-fund --ignore-scripts playwright@1.64.1
          # DECISION(2026-10-26, rcc00n/Codex): use the hosted image's installed Chrome and fail if absent.
          # Why: repeated Ubuntu-mirror font downloads exhausted CI timeouts before any browser test ran.
          quorum_ci_chrome="$(command -v google-chrome)"
          test -x "$quorum_ci_chrome"
          "$quorum_ci_chrome" --version
          echo "CHROMIUM_PATH=$quorum_ci_chrome" >> "$GITHUB_ENV"
      - name: Run authenticated browser regressions
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/quorum-browser/node_modules/playwright
          QUORUM_SCREENSHOTS: ${{ runner.temp }}/quorum-screenshots
          QUORUM_PYTHON: python
        run: |
          node web/tests/boundary.cjs
          node web/tests/boundary.cjs --reasoning
          node web/tests/boundary.cjs --reasoning --roundup-checks

  combined-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DJANGO_DEBUG: '1'
      QUORUM_DRY_RUN: '1'
      # Synthetic route for the legacy seed-journal test; sockets remain blocked.
      MODEL_BASE_URL: 'http://127.0.0.1:1'
      MODEL_API_KEY: 'TEST-offline-only'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.txt -e './reasoning[dev]'
      # DECISION(2026-10-24, rcc00n/Codex): combined checks block all Python sockets.
      # Why: fixtures and replay tests must never consume credits or establish sponsor acceptance.
      - name: Verify reasoning, collection contracts and actual snapshot handoff offline
        run: |
          mkdir -p "$RUNNER_TEMP/offline"
          cat > "$RUNNER_TEMP/offline/sitecustomize.py" <<'PY'
          import socket
          def blocked(*args, **kwargs):
              raise OSError('OFFLINE TEST: network connection blocked')
          socket.socket.connect = blocked
          socket.socket.connect_ex = blocked
          socket.create_connection = blocked
          PY
          export PYTHONPATH="$RUNNER_TEMP/offline:$PWD/reasoning:$PWD/backend"
          python -m pytest reasoning/tests -q
          python -c "from collectors import verify_collectors as v; v.check_csv(); assert 'FAIL' not in v.seen"
          python -m unittest discover -s scripts -p 'test_*.py'
          python -m quorum_reasoning.run --dry-run --quiet --out "$RUNNER_TEMP/quorum-dry"
          python - <<'PY'
          import os
          from pathlib import Path
          from portal.reasoning_preview import load_preview
          paths = [*Path('docs/examples').glob('snapshot*.json'), *Path(os.environ['RUNNER_TEMP'], 'quorum-dry').glob('*/20*/v*.json')]
          assert len(paths) >= 4, 'Missing canonical or freshly generated snapshots'
          for path in paths:
              load_preview(path)
          print('PASS: canonical samples and fresh dry graph output accepted by portal; fictional, unpublished')
          PY
          bash scripts/verify-all.sh --offline || test "$?" -eq 2
